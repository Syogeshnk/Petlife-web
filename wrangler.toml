# Cloudflare Workers static-assets config for petlifeindia.co.
#
# The site is pure static HTML/CSS/JS — there is no Worker script, so there is no
# `main` entry. Wrangler serves ./dist directly, including its _headers and
# _redirects files.
#
# ./dist is NOT in git. It is produced by stage-deploy.py, which copies only the
# public files out of Website/. Pointing this at Website/ instead would publish
# the Supabase migrations, the edge-function source and the CLI's linked-project
# state. So the build command must run before the deploy command:
#
#   Build command:   python3 stage-deploy.py
#   Deploy command:  npx wrangler deploy

# Must match the Cloudflare project name exactly ("petlifeweb", no hyphen) or
# every build logs "Failed to match Worker name" and silently overrides this
# value, and Workers Builds will auto-open a PR against this file to fix it.
name = "petlifeweb"
compatibility_date = "2026-07-26"

[assets]
directory = "./dist"
# Every route is a real file (index.html, careers.html, ...) — there is no SPA
# router, so a missing path is a genuine 404 and must keep returning 404, not
# be rewritten to some other page. "404-page" serves dist/404.html with the
# status intact, which is the only variant that is both useful to a visitor
# and honest to a crawler. Do NOT use "single-page-application": it answers 200
# for every unknown URL, which invites Google to index infinite soft-404s.
not_found_handling = "404-page"
# DO NOT set html_handling = "none". That was tried and reverted: it disables
# ALL url rewriting, which also removes the implicit "/" -> "/index.html"
# mapping every static host needs — it took the homepage itself to a 404
# (confirmed live: "/" 404, "/index.html" 200). The default
# ("auto-trailing-slash") is what actually works: "/" serves index.html, and
# .html links (this site references itself with the extension everywhere,
# e.g. <a href="careers.html">) still resolve, just via one 307 redirect to
# the extensionless URL first. That redirect is a one-hop, sub-millisecond,
# same-origin, browser-cached-per-session cost — not a defect worth trading
# the homepage for. Leaving html_handling unset accepts the default.
